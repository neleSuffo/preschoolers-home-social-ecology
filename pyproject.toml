[tool.poetry]
name = "home-social-ecology"
version = "0.1.0"
description = "Automated multimodal social ecology pipeline for preschoolers' home environments"
authors = ["Nele-Pauline Suffo"]
readme = "README.md"
packages = [
    { include = "src" },
]

[tool.poetry.dependencies]
python = "^3.12"

# Numerical and Data Analysis
numpy = "^2.1.0"
pandas = "^2.2.0"
scipy = "^1.12.0"
scikit-learn = "^1.4.0"

# Change-point Detection (CPD)
ruptures = "^1.1.9"

# Deep Learning & Vision (YOLOv12 Inference & Visualizer)
torch = "^2.4.0"
torchvision = "^0.19.0"
ultralytics = "^8.4.30"
supervision = "^0.25.1"
opencv-python-headless = "^4.10.0.84"
pillow = "^10.2.0"

# Audio & Speech Classifiers
transformers = "^4.40.0"
huggingface-hub = "^0.27.1"

# Visualization & Progress
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
tqdm = "^4.66.0"

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.0"
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"